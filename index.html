    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "name": "HotelStory",
            "url": "https://hotel-story.vercel.app/",
            "founder": {
              "@type": "Person",
              "name": "Sarvesh Lotankar",
              "jobTitle": "Founder & Brand Strategist"
            },
            "description": "Social media marketing agency for hotels, restaurants, cafés, bars, and venues."
          },
          {
            "@type": "ProfessionalService",
            "name": "HotelStory",
            "url": "https://hotel-story.vercel.app/",
            "description": "Social media marketing, visual production, and brand positioning for hospitality and entertainment.",
            "areaServed": "Worldwide"
          },
          {
            "@type": "FAQPage",
            "mainEntity": [
              {
                "@type": "Question",
                "name": "How soon will we see progress after starting?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "You will see an immediate step up in visual quality, consistency, and profile clarity in your first month. Organic reach and direct enquiry momentum build steadily as we test hooks, publish Reels, and learn what your local audience saves and messages about."
                }
              },
              {
                "@type": "Question",
                "name": "Do you work with only one brand per city or micro-market?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Yes—for direct competitors in the same category and micro-market (such as two fine-dining restaurants on the same street or two boutique hotels on the same stretch), we offer category exclusivity so we are never competing against ourselves."
                }
              },
              {
                "@type": "Question",
                "name": "What platforms do you manage?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Our core focus is Instagram (Reels, Carousels, Stories), Facebook, YouTube Shorts, and Google Business Profile—the exact channels where hospitality and nightlife discovery happen. LinkedIn for corporate banquets and Pinterest for wedding venues are included in Growth and Dominator tiers."
                }
              },
              {
                "@type": "Question",
                "name": "How do on-site photo and video shoots work?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Our production crew schedules a structured 1-to-2 day shoot at your venue using an approved shot list covering hero dishes, drinks, ambiance, rooms, event setups, and team warmth. Between shoot days, we also coach your team on capturing effortless real-time moments."
                }
              },
              {
                "@type": "Question",
                "name": "How is pricing structured?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Because an artisan café or cocktail lounge has very different production and ad needs from a multi-room resort or grand wedding venue, we tailor retainers after your free social audit and discovery call. No hidden fees, and ad spend goes directly to the platforms."
                }
              },
              {
                "@type": "Question",
                "name": "Are there long lock-in contracts?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "No. We work on flexible monthly retainers with no long lock-in contracts. You stay with us because the content, communication, and reporting deliver real value for your business."
                }
              }
            ]
          }
        ]
      }
